[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fde-case-study"
version = "1.0.0"
description = "Deployment case study and runbook tying together the eleven FDE portfolio projects, with a verification harness that checks every quoted number against its source repo"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
